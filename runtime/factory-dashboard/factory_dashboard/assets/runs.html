<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="factory-token" content="@@TOKEN@@"><title>Hermes · Factory runs</title><link rel="stylesheet" href="/assets/timeline.css"><style>
#main{max-width:1100px}.rb-intro{color:var(--muted);max-width:780px}
.rb-chips{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.rb-chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px;min-width:110px}.rb-chip strong{font-size:20px}.rb-chip span{font-size:11px;color:var(--muted)}.rb-chip.zero{opacity:.5}
.rb-list{display:grid;gap:14px}.rb-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}.rb-card header{display:flex;justify-content:space-between;gap:16px;align-items:start}.rb-card h2{margin:0;font-size:18px;line-height:1.35}.rb-card h4{font-size:12px;margin:18px 0 8px;color:#e8b981}
.rb-why{color:#c3cbda;margin:8px 0 14px}.rb-badge{font-size:11px;border:1px solid #3d4658;background:#202735;border-radius:20px;padding:5px 11px;white-space:nowrap}.rb-badge.good{color:#9fdcb7;border-color:#385543;background:#1a2a23}.rb-badge.warn{color:#e8b981;border-color:#695032;background:#302619}.rb-badge.bad{color:#f1a1aa;border-color:#6b3540;background:#2e1a1f}
.rb-progress{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-bottom:14px}.rb-bar{flex:0 0 240px;height:6px;background:#252b38;border-radius:4px;overflow:hidden}.rb-bar span{display:block;height:100%;background:#7fc49d}
.rb-facts{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:0;font-size:12px}.rb-facts dt{color:var(--muted)}.rb-facts dd{margin:0;overflow-wrap:anywhere}.rb-mono,.rb-ids{font:11px ui-monospace,monospace;color:#8e99ab}
.rb-stuck{margin:0;padding-left:18px;display:grid;gap:10px;font-size:12px}.rb-muted{color:var(--muted);font-size:12px}
.rb-actions{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}.rb-actions>div{display:grid;gap:4px;max-width:300px}.rb-actions button{justify-self:start;text-transform:capitalize}
.rb-alert{border:1px solid #6b3540;background:#2e1a1f;color:#f3c4ca;border-radius:8px;padding:12px 14px;margin:16px 0;font-size:13px}
.rb-cardline{display:grid;gap:4px}.rb-reason{white-space:pre-wrap;word-break:break-word;font:11px/1.6 ui-monospace,monospace;color:#b8c3d3;background:#0f131c;padding:10px;border-radius:6px;max-height:260px;overflow:auto;margin:4px 0}
.rb-recover{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}.rb-options{display:grid;gap:8px;margin:10px 0 12px}.rb-option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}.rb-option input{width:auto;margin:3px 0 0}.rb-option span{display:grid;gap:3px}.rb-option select{margin:6px 0 0;width:auto}.rb-recover textarea{width:100%;background:#0e131c;color:var(--text);border:1px solid #343b4d;border-radius:6px;padding:10px;font:inherit}
details{margin:8px 0}summary{cursor:pointer;color:#c3cbda;padding:6px 0}.rb-legacy{list-style:none;padding:0;display:grid;gap:12px}.rb-legacy li{border-bottom:1px solid var(--line);padding-bottom:10px}.rb-legacy-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
</style></head>

<main id="main"><p>Loading Factory runs…</p></main></div><script src="/assets/runs.js"></script></body></html>
