<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2013" viewBox="0 0 1200 2013" role="img" aria-labelledby="title desc">
<title id="title">Hermes Factory project and task workflow</title>
<desc id="desc">Orchestrator selects relevant art and audio directors, then the architect consumes their plans and decomposes the project; a plan review precedes any work. Each dependent small task has a writer, verification before independent reviews, specialist repair routing with scoped re-reviews, and a bounded path back to the architect. Final integration repeats the checks with the complete panel; factory-retro proposes improvements.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#778bab"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#ffc773"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.title{fill:#f2f5ff;font-size:34px;font-weight:700}.name{fill:#eef3ff;font-size:22px;font-weight:650}.body{fill:#b1c0d8;font-size:16px}.small{fill:#b1c0d8;font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:1.7px}.back{fill:none;stroke:#ffc773;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#b)}.line{fill:none;stroke:#778bab;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1200" height="2013" rx="24" fill="#0b1220"/>

<text x="48" y="48" class="label" fill="#93a9cd">HERMES / PROJECT WORKFLOW V2</text>
<text x="48" y="96" class="title">Review the plan. Verify every task. Improve the factory.</text>
<text x="48" y="129" class="body">Director intent flows into architecture, implementation, and the final integrated result.</text>
<rect x="336" y="168" width="528" height="86" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="336" y="184" width="3" height="54" rx="1.5" fill="#ffc773"/>
<text x="356" y="199" class="name">factory-orchestrator</text>
<text x="356" y="228" class="body">Capture scope and decide which directors are needed.</text>
<path d="M600 254 V280 H220 V316" class="line"/>
<path d="M600 280 V316" class="line"/>
<path d="M600 280 H980 V316" class="line"/>
<text x="48" y="301" class="label" fill="#b69cff">IF ART IS NEEDED</text>
<text x="440" y="301" class="label" fill="#90aaff">NO ART OR AUDIO</text>
<text x="808" y="301" class="label" fill="#51d6c2">IF SOUND IS NEEDED</text>
<rect x="48" y="316" width="344" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="48" y="332" width="3" height="76" rx="1.5" fill="#b69cff"/>
<text x="68" y="347" class="name">art-director</text>
<text x="68" y="376" class="body">Define visual intent, references,</text>
<text x="68" y="399" class="body">asset paths and render criteria.</text>
<rect x="428" y="316" width="344" height="108" rx="14" fill="#101b2d" stroke="#25344e"/>
<text x="448" y="348" class="name">Skip director planning</text>
<text x="448" y="377" class="body">Go directly to the architect.</text>
<text x="448" y="400" class="body">The architect may still request one.</text>
<rect x="808" y="316" width="344" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="808" y="332" width="3" height="76" rx="1.5" fill="#51d6c2"/>
<text x="828" y="347" class="name">audio-director</text>
<text x="828" y="376" class="body">Define audible intent, recipes,</text>
<text x="828" y="399" class="body">music cues and listening criteria.</text>
<path d="M220 424 V455 H580 V488" class="line"/>
<path d="M600 424 V488" class="line"/>
<path d="M980 424 V455 H620 V488" class="line"/>
<rect x="248" y="488" width="704" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="504" width="3" height="76" rx="1.5" fill="#90aaff"/>
<text x="268" y="519" class="name">architect</text>
<text x="268" y="548" class="body">Consume the relevant director plans, then design the code and integration.</text>
<text x="268" y="571" class="body">Break the project into small tasks with dependencies and acceptance criteria.</text>
<path d="M600 596 V634" class="line"/>
<rect x="248" y="634" width="704" height="88" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="650" width="3" height="56" rx="1.5" fill="#80d8a0"/>
<text x="268" y="665" class="name">Plan review</text>
<text x="268" y="694" class="body">A code reviewer checks the task graph and acceptance criteria before any work starts.</text>
<path d="M248 678 H224 V542 H248" class="back"/>
<text x="212" y="614" class="label" fill="#ffc773" text-anchor="end">BLOCKING FINDINGS</text>
<path d="M1152 1000 H1176 V542 H952" class="back"/>
<text x="1170" y="530" class="label" fill="#ffc773" text-anchor="end">REPLAN PATH · MAX 2</text>
<path d="M600 722 V764" class="line"/>
<rect x="48" y="764" width="1104" height="128" rx="14" fill="#101b2d" stroke="#25344e"/>
<text x="72" y="795" class="label" fill="#93a9cd">CAPTURED TASK GRAPH / EXAMPLE</text>
<rect x="72" y="814" width="300" height="74" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="72" y="830" width="3" height="26" rx="1.5" fill="#b69cff"/>
<text x="92" y="845" class="name">Task A · art assets</text>
<text x="92" y="874" class="body">artist</text>
<rect x="444" y="814" width="300" height="74" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="444" y="830" width="3" height="26" rx="1.5" fill="#51d6c2"/>
<text x="464" y="845" class="name">Task B · sound assets</text>
<text x="464" y="874" class="body">sound-designer</text>
<rect x="816" y="814" width="312" height="74" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="816" y="830" width="3" height="26" rx="1.5" fill="#90aaff"/>
<text x="836" y="845" class="name">Task C · integrate code</text>
<text x="836" y="874" class="body">developer · depends on A + B</text>
<path d="M372 844 H408 V806 H792 V831 H816" class="line"/>
<path d="M744 856 H816" class="line"/>
<path d="M600 892 V930" class="line"/>
<rect x="48" y="930" width="1104" height="572" rx="14" fill="#101b2d" stroke="#365077"/>
<text x="72" y="965" class="label" fill="#90aaff">EVERY SMALL TASK GETS ITS OWN FACTORY CYCLE</text>
<text x="1128" y="965" class="label" fill="#ffc773" text-anchor="end">REPAIR LIMIT HIT OR PLAN DEFECT → BACK TO ARCHITECT</text>
<text x="72" y="993" class="body">Only the agents needed by this task participate. Dependencies must finish their full cycle first.</text>
<rect x="80" y="1022" width="328" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="80" y="1038" width="3" height="76" rx="1.5" fill="#90aaff"/>
<text x="100" y="1053" class="name">Task writer</text>
<text x="100" y="1082" class="body">developer / artist / sound-designer</text>
<text x="100" y="1105" class="body">Implement the captured task plan.</text>
<path d="M244 1130 V1160" class="line"/>
<rect x="80" y="1160" width="328" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="80" y="1176" width="3" height="76" rx="1.5" fill="#80d8a0"/>
<text x="100" y="1191" class="name">verifier</text>
<text x="100" y="1220" class="body">Run acceptance, tests and lint gates.</text>
<text x="100" y="1243" class="body">Reviewers are never started on FAIL.</text>
<path d="M408 1214 H466" class="line"/>
<text x="420" y="1196" class="label" fill="#80d8a0">PASS</text>
<rect x="480" y="1022" width="624" height="354" rx="14" fill="#152137" stroke="#2b3b55"/>
<text x="504" y="1054" class="label" fill="#80d8a0">INDEPENDENT REVIEWS / AFTER VERIFIER PASS</text>
<text x="504" y="1093" class="name">claude-reviewer</text>
<text x="504" y="1117" class="small">Code correctness and design</text>
<text x="800" y="1093" class="name">codex-reviewer</text>
<text x="800" y="1117" class="small">High-risk tasks and integration only</text>
<text x="504" y="1168" class="name">security-reviewer</text>
<text x="504" y="1192" class="small">Security boundaries and risks</text>
<text x="800" y="1168" class="name">ux-reviewer</text>
<text x="800" y="1192" class="small">User journeys, when relevant</text>
<text x="504" y="1243" class="name">ui-reviewer</text>
<text x="504" y="1267" class="small">Interface quality, when relevant</text>
<text x="800" y="1243" class="name">art-reviewer</text>
<text x="800" y="1267" class="small">Rendered result vs director intent</text>
<text x="504" y="1318" class="name">audio-reviewer</text>
<text x="504" y="1342" class="small">Listened result vs director intent</text>
<rect x="80" y="1310" width="328" height="100" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="80" y="1326" width="3" height="68" rx="1.5" fill="#ffc773"/>
<text x="100" y="1341" class="name">fixer + specialist repairs</text>
<text x="100" y="1370" class="body">Code → fixer · art → artist</text>
<text x="100" y="1393" class="body">Sound → sound-designer</text>
<path d="M80 1359 H64 V1214 H80" class="line"/>
<text x="80" y="1296" class="label" fill="#ffc773">FAIL OR FINDINGS · LOOP BOUND: MAX 0–3 REPAIRS</text>
<path d="M480 1336 H432 V1359 H408" class="line"/>
<text x="490" y="1418" class="body">Any repair → fresh verifier → only the affected reviews.</text>
<text x="490" y="1446" class="small">Missing render/listening tools → human recovery; no approval.</text>
<text x="490" y="1472" class="small">Repair limit or plan defect → architect replans (max 2 per project), then a human.</text>
<path d="M600 1502 V1540" class="line"/>
<rect x="248" y="1540" width="704" height="131" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="1556" width="3" height="99" rx="1.5" fill="#80d8a0"/>
<text x="268" y="1571" class="name">Final project integration</text>
<text x="268" y="1600" class="body">developer assembles the completed tasks; verifier first, then the full panel.</text>
<text x="268" y="1623" class="body">Art: actual in-engine rendering. Sound: real listening evidence.</text>
<text x="268" y="1646" class="body">A failing criterion is repaired by the specialist of the task that owns it.</text>
<path d="M600 1671 V1709" class="line"/>
<rect x="248" y="1709" width="704" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="1725" width="3" height="76" rx="1.5" fill="#ffc773"/>
<text x="268" y="1740" class="name">factory-retro</text>
<text x="268" y="1769" class="body">Analyze task failures, repairs, review findings and the overall outcome.</text>
<text x="268" y="1792" class="body">Propose evidence-backed Factory improvements; never apply them itself.</text>
<path d="M600 1817 V1853" class="line"/>
<rect x="248" y="1853" width="704" height="72" rx="14" fill="#14271f" stroke="#335f49"/>
<text x="268" y="1883" class="name">Delivery or human intervention</text>
<text x="268" y="1909" class="body">Retro preserves the outcome; it cannot waive failed checks.</text>
<text x="48" y="1963" class="small">Publishing, when separately invoked: pr-writer drafts the description; the publisher opens a draft PR.</text>
<text x="48" y="1988" class="small">Existing tasks retain their captured v1 workflow. New v2 tasks use this project / task hierarchy.</text>
</svg>
