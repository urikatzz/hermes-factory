<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1840" viewBox="0 0 1200 1840" role="img" aria-labelledby="title desc">
<title id="title">Hermes Factory project and task workflow</title>
<desc id="desc">Orchestrator selects relevant art and audio directors, then the architect consumes their plans and decomposes the project. Each dependent small task has a writer, verification before independent reviews, and specialist repair routing. Final integration repeats those checks; factory-retro proposes improvements.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#778bab"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.title{fill:#f2f5ff;font-size:34px;font-weight:700}.name{fill:#eef3ff;font-size:22px;font-weight:650}.body{fill:#b1c0d8;font-size:16px}.small{fill:#b1c0d8;font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:1.7px}.line{fill:none;stroke:#778bab;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1200" height="1840" rx="24" fill="#0b1220"/>

<text x="48" y="48" class="label" fill="#93a9cd">HERMES / PROJECT WORKFLOW V2</text>
<text x="48" y="96" class="title">Plan once. Verify every task. Improve the factory.</text>
<text x="48" y="129" class="body">Director intent flows into architecture, implementation, and the final integrated result.</text>
<rect x="336" y="168" width="528" height="86" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="336" y="184" width="3" height="54" rx="1.5" fill="#ffc773"/>
<text x="356" y="199" class="name">factory-orchestrator</text>
<text x="356" y="228" class="body">Capture scope and decide which directors are needed.</text>
<path d="M600 254 V280 H220 V316" class="line"/>
<path d="M600 280 V316" class="line"/>
<path d="M600 280 H980 V316" class="line"/>
<text x="48" y="301" class="label" fill="#b69cff">IF ART IS NEEDED</text>
<text x="440" y="301" class="label" fill="#90aaff">NO ART OR AUDIO</text>
<text x="808" y="301" class="label" fill="#51d6c2">IF SOUND IS NEEDED</text>
<rect x="48" y="316" width="344" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="48" y="332" width="3" height="76" rx="1.5" fill="#b69cff"/>
<text x="68" y="347" class="name">art-director</text>
<text x="68" y="376" class="body">Define visual intent, references,</text>
<text x="68" y="399" class="body">asset paths and render criteria.</text>
<rect x="428" y="316" width="344" height="108" rx="14" fill="#101b2d" stroke="#25344e"/>
<text x="448" y="348" class="name">Skip director planning</text>
<text x="448" y="377" class="body">Go directly to the architect.</text>
<text x="448" y="400" class="body">Use both directors when needed.</text>
<rect x="808" y="316" width="344" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="808" y="332" width="3" height="76" rx="1.5" fill="#51d6c2"/>
<text x="828" y="347" class="name">audio-director</text>
<text x="828" y="376" class="body">Define audible intent, recipes,</text>
<text x="828" y="399" class="body">music cues and listening criteria.</text>
<path d="M220 424 V455 H580 V488" class="line"/>
<path d="M600 424 V488" class="line"/>
<path d="M980 424 V455 H620 V488" class="line"/>
<rect x="248" y="488" width="704" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="504" width="3" height="76" rx="1.5" fill="#90aaff"/>
<text x="268" y="519" class="name">architect</text>
<text x="268" y="548" class="body">Consume the relevant director plans, then design the code and integration.</text>
<text x="268" y="571" class="body">Break the project into small tasks with dependencies and acceptance criteria.</text>
<path d="M600 596 V638" class="line"/>
<rect x="48" y="638" width="1104" height="128" rx="14" fill="#101b2d" stroke="#25344e"/>
<text x="72" y="669" class="label" fill="#93a9cd">CAPTURED TASK GRAPH / EXAMPLE</text>
<rect x="72" y="688" width="300" height="74" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="72" y="704" width="3" height="26" rx="1.5" fill="#b69cff"/>
<text x="92" y="719" class="name">Task A · art assets</text>
<text x="92" y="748" class="body">artist</text>
<rect x="444" y="688" width="300" height="74" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="444" y="704" width="3" height="26" rx="1.5" fill="#51d6c2"/>
<text x="464" y="719" class="name">Task B · sound assets</text>
<text x="464" y="748" class="body">sound-designer</text>
<rect x="816" y="688" width="312" height="74" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="816" y="704" width="3" height="26" rx="1.5" fill="#90aaff"/>
<text x="836" y="719" class="name">Task C · integrate code</text>
<text x="836" y="748" class="body">developer · depends on A + B</text>
<path d="M372 718 H408 V680 H792 V705 H816" class="line"/>
<path d="M744 730 H816" class="line"/>
<path d="M600 766 V804" class="line"/>
<rect x="48" y="804" width="1104" height="548" rx="14" fill="#101b2d" stroke="#365077"/>
<text x="72" y="839" class="label" fill="#90aaff">EVERY SMALL TASK GETS ITS OWN FACTORY CYCLE</text>
<text x="72" y="867" class="body">Only the agents needed by this task participate. Dependencies must finish their full cycle first.</text>
<rect x="80" y="896" width="328" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="80" y="912" width="3" height="76" rx="1.5" fill="#90aaff"/>
<text x="100" y="927" class="name">Task writer</text>
<text x="100" y="956" class="body">developer / artist / sound-designer</text>
<text x="100" y="979" class="body">Implement the captured task plan.</text>
<path d="M244 1004 V1034" class="line"/>
<rect x="80" y="1034" width="328" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="80" y="1050" width="3" height="76" rx="1.5" fill="#80d8a0"/>
<text x="100" y="1065" class="name">verifier</text>
<text x="100" y="1094" class="body">Run acceptance, tests and lint gates.</text>
<text x="100" y="1117" class="body">Reviewers are never started on FAIL.</text>
<path d="M408 1088 H466" class="line"/>
<text x="420" y="1070" class="label" fill="#80d8a0">PASS</text>
<rect x="480" y="896" width="624" height="354" rx="14" fill="#152137" stroke="#2b3b55"/>
<text x="504" y="928" class="label" fill="#80d8a0">INDEPENDENT REVIEWS / AFTER VERIFIER PASS</text>
<text x="504" y="967" class="name">claude-reviewer</text>
<text x="504" y="991" class="small">Code correctness and design</text>
<text x="800" y="967" class="name">codex-reviewer</text>
<text x="800" y="991" class="small">Additional code review when selected</text>
<text x="504" y="1042" class="name">security-reviewer</text>
<text x="504" y="1066" class="small">Security boundaries and risks</text>
<text x="800" y="1042" class="name">ux-reviewer</text>
<text x="800" y="1066" class="small">User journeys, when relevant</text>
<text x="504" y="1117" class="name">ui-reviewer</text>
<text x="504" y="1141" class="small">Interface quality, when relevant</text>
<text x="800" y="1117" class="name">art-reviewer</text>
<text x="800" y="1141" class="small">Rendered result vs director intent</text>
<text x="504" y="1192" class="name">audio-reviewer</text>
<text x="504" y="1216" class="small">Listened result vs director intent</text>
<rect x="80" y="1184" width="328" height="100" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="80" y="1200" width="3" height="68" rx="1.5" fill="#ffc773"/>
<text x="100" y="1215" class="name">fixer + specialist repairs</text>
<text x="100" y="1244" class="body">Code → fixer · art → artist</text>
<text x="100" y="1267" class="body">Sound → sound-designer</text>
<path d="M80 1233 H64 V1088 H80" class="line"/>
<text x="80" y="1170" class="label" fill="#ffc773">FAIL OR REVIEW FINDINGS</text>
<path d="M480 1210 H432 V1233 H408" class="line"/>
<text x="490" y="1292" class="body">Any repair → fresh verifier → all selected reviews.</text>
<text x="490" y="1320" class="small">Missing render/listening tools → human recovery; no approval.</text>
<path d="M600 1352 V1390" class="line"/>
<rect x="248" y="1390" width="704" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="1406" width="3" height="76" rx="1.5" fill="#80d8a0"/>
<text x="268" y="1421" class="name">Final project integration</text>
<text x="268" y="1450" class="body">developer assembles the completed tasks; repeat verifier-first checks.</text>
<text x="268" y="1473" class="body">Art: actual in-engine rendering. Sound: real listening evidence.</text>
<path d="M600 1498 V1536" class="line"/>
<rect x="248" y="1536" width="704" height="108" rx="14" fill="#152137" stroke="#2b3b55"/>
<rect x="248" y="1552" width="3" height="76" rx="1.5" fill="#ffc773"/>
<text x="268" y="1567" class="name">factory-retro</text>
<text x="268" y="1596" class="body">Analyze task failures, repairs, review findings and the overall outcome.</text>
<text x="268" y="1619" class="body">Propose evidence-backed Factory improvements; never apply them itself.</text>
<path d="M600 1644 V1680" class="line"/>
<rect x="248" y="1680" width="704" height="72" rx="14" fill="#14271f" stroke="#335f49"/>
<text x="268" y="1710" class="name">Delivery or human intervention</text>
<text x="268" y="1736" class="body">Retro preserves the outcome; it cannot waive failed checks.</text>
<text x="48" y="1790" class="small">Publishing, when separately invoked: pr-writer drafts the description; the publisher opens a draft PR.</text>
<text x="48" y="1815" class="small">Existing tasks retain their captured v1 workflow. New v2 tasks use this project / task hierarchy.</text>
</svg>
